```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器信息</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Microsoft YaHei", Arial, sans-serif;
            background:
                radial-gradient(circle at 10% 20%, rgba(99,102,241,.25), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(14,165,233,.22), transparent 30%),
                #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 760px;
        }

        /* 顶部标题 */
        .header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .server-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            box-shadow: 0 10px 30px rgba(99,102,241,.35);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #f8fafc;
        }

        .subtitle {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 20px;
            background: rgba(34,197,94,.1);
            border: 1px solid rgba(34,197,94,.2);
            color: #4ade80;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        /* 主卡片 */
        .card {
            background: rgba(15,23,42,.78);
            border: 1px solid rgba(148,163,184,.16);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 28px;
            box-shadow:
                0 25px 60px rgba(0,0,0,.35),
                inset 0 1px rgba(255,255,255,.04);
        }

        .card-title {
            font-size: 16px;
            color: #f8fafc;
            margin-bottom: 22px;
            font-weight: 600;
        }

        /* 信息项 */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-item {
            display: grid;
            grid-template-columns: 150px 1fr auto;
            align-items: center;
            min-height: 62px;
            padding: 0 16px;
            border-radius: 14px;
            background: rgba(30,41,59,.65);
            border: 1px solid rgba(148,163,184,.08);
            transition: .2s ease;
        }

        .info-item:hover {
            background: rgba(51,65,85,.7);
            border-color: rgba(99,102,241,.3);
            transform: translateY(-1px);
        }

        .label {
            color: #94a3b8;
            font-size: 14px;
        }

        .value {
            color: #f8fafc;
            font-size: 15px;
            font-weight: 500;
            word-break: break-all;
        }

        .password {
            letter-spacing: 2px;
        }

        /* 复制按钮 */
        .copy-btn,
        .eye-btn {
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            font-size: 14px;
            padding: 8px;
            border-radius: 8px;
            transition: .2s;
        }

        .copy-btn:hover,
        .eye-btn:hover {
            color: #60a5fa;
            background: rgba(96,165,250,.1);
        }

        .password-box {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 底部按钮 */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: .2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            box-shadow: 0 8px 20px rgba(79,70,229,.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(79,70,229,.35);
        }

        .btn-secondary {
            background: rgba(51,65,85,.65);
            color: #cbd5e1;
            border: 1px solid rgba(148,163,184,.12);
        }

        .btn-secondary:hover {
            background: rgba(71,85,105,.7);
        }

        /* 提示 */
        .notice {
            margin-top: 18px;
            padding: 13px 15px;
            border-radius: 12px;
            background: rgba(245,158,11,.08);
            border: 1px solid rgba(245,158,11,.15);
            color: #fbbf24;
            font-size: 12px;
            line-height: 1.6;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            color: #f8fafc;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
            border: 1px solid rgba(148,163,184,.15);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .header {
                align-items: flex-start;
            }

            .status {
                display: none;
            }

            .card {
                padding: 18px;
                border-radius: 18px;
            }

            .info-item {
                grid-template-columns: 100px 1fr auto;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 顶部 -->
    <div class="header">
        <div class="title-box">
            <div class="server-icon">🖥️</div>

            <div>
                <h1>服务器信息</h1>
                <div class="subtitle">Server Connection Details</div>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            信息正常
        </div>
    </div>

    <!-- 信息卡片 -->
    <div class="card">

        <div class="card-title">
            🔐 登录信息
        </div>

        <div class="info-list">

            <!-- Hostname -->
            <div class="info-item">
                <div class="label">Hostname</div>

                <div class="value" id="hostname">
                    60.13.248.196
                </div>

                <button class="copy-btn"
                        onclick="copyText('60.13.248.196')">
                    复制
                </button>
            </div>

            <!-- Port -->
            <div class="info-item">
                <div class="label">Port</div>

                <div class="value" id="port">
                    3322
                </div>

                <button class="copy-btn"
                        onclick="copyText('3322')">
                    复制
                </button>
            </div>

            <!-- Username -->
            <div class="info-item">
                <div class="label">Username</div>

                <div class="value" id="username">
                    root
                </div>

                <button class="copy-btn"
                        onclick="copyText('root')">
                    复制
                </button>
            </div>

            <!-- Password -->
            <div class="info-item">
                <div class="label">Password</div>

                <div class="password-box">
                    <span class="value password"
                          id="password">
                        ••••••••
                    </span>

                    <button class="eye-btn"
                            onclick="togglePassword()"
                            id="eye">
                        👁
                    </button>
                </div>

                <button class="copy-btn"
                        onclick="copyText('123456')">
                    复制
                </button>
            </div>

        </div>

        <!-- 操作按钮 -->
        <div class="actions">

            <button class="btn btn-primary"
                    onclick="copyAll()">
                📋 复制全部信息
            </button>

            <button class="btn btn-secondary"
                    onclick="openSSH()">
                🔗 SSH连接
            </button>

        </div>

        <div class="notice">
            ⚠️ 安全提示：此页面包含服务器登录凭据。
            如果部署到公网，请不要直接将真实密码写在 HTML 源代码中。
        </div>

    </div>

</div>

<!-- Toast -->
<div class="toast" id="toast">
    已复制
</div>

<script>

    let passwordVisible = false;

    // 显示 / 隐藏密码
    function togglePassword() {

        const password = document.getElementById("password");
        const eye = document.getElementById("eye");

        passwordVisible = !passwordVisible;

        if (passwordVisible) {
            password.textContent = "123456";
            eye.textContent = "🙈";
        } else {
            password.textContent = "••••••••";
            eye.textContent = "👁";
        }
    }


    // 复制内容
    function copyText(text) {

        navigator.clipboard.writeText(text)
            .then(() => {
                showToast("已复制到剪贴板");
            })
            .catch(() => {
                showToast("复制失败");
            });
    }


    // 复制全部
    function copyAll() {

        const text =
`Hostname : 60.13.248.196
Port     : 3322
Username : root
Password : 123456`;

        copyText(text);
    }


    // SSH连接
    function openSSH() {

        const sshUrl =
            "ssh://root@60.13.248.196:3322";

        window.location.href = sshUrl;

        showToast("正在尝试打开 SSH");
    }


    // Toast
    function showToast(message) {

        const toast = document.getElementById("toast");

        toast.textContent = message;
        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 1800);
    }

</script>

</body>
</html>
